name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NEW_ARCHITECTURE_ENABLED: '0'

      - name: Patch gradle.properties for reanimated
        run: |
          if grep -q "newArchEnabled" android/gradle.properties; then
            sed -i 's/newArchEnabled=.*/newArchEnabled=false/' android/gradle.properties
          else
            echo "newArchEnabled=false" >> android/gradle.properties
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          EXPO_NEW_ARCHITECTURE_ENABLED: '0'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5
