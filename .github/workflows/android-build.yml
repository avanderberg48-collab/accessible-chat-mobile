name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      
      - name: Fix async-storage local repo
        run: |
          LOCAL_REPO="$PWD/node_modules/@react-native-async-storage/async-storage/android/local_repo"
          if [ -d "$LOCAL_REPO" ]; then
            mkdir -p ~/.m2/repository
            cp -r "$LOCAL_REPO"/. ~/.m2/repository/
            echo "✅ Copied async-storage local_repo to ~/.m2/repository"
          else
            echo "⚠️  local_repo not found, skipping"
          fi
      
      - name: Create init.gradle to force mavenLocal
        run: |
          mkdir -p ~/.gradle/init.gradle.d
          cat > ~/.gradle/init.gradle.d/force-maven-local.gradle << 'INITEOF'
          allprojects {
            repositories {
              mavenLocal()
            }
          }
          settingsEvaluated { settings ->
            settings.pluginManagement.repositories.mavenLocal()
            settings.dependencyResolutionManagement.repositories.mavenLocal()
          }
          INITEOF
          echo "✅ Created init.gradle"
          cat ~/.gradle/init.gradle.d/force-maven-local.gradle
      
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle_output.txt
          tail -50 /tmp/gradle_output.txt
      
      - name: Check APK exists
        run: ls -la android/app/build/outputs/apk/debug/
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: accessible-chat-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1