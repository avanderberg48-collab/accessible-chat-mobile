name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Enable New Architecture
        run: |
          sed -i 's/"newArchEnabled": false/"newArchEnabled": true/' app.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix build.gradle - add google maven + fix kotlin version
        run: |
          cat > android/build.gradle << 'GRADLE'
          buildscript {
            ext {
              kotlinVersion = '1.9.22'
            }
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath('com.android.tools.build:gradle')
              classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
            }
          }

          allprojects {
            repositories {
              google()
              mavenCentral()
              mavenLocal()
            }
          }

          android {
            repositories {
              google()
              mavenCentral()
              mavenLocal()
            }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -DnewArchEnabled=true
        env:
          EXPO_NEW_ARCHITECTURE_ENABLED: '1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5