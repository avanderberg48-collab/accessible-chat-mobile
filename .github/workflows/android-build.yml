name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Patch settings.gradle for mavenLocal
        run: |
          python3 << 'PYEOF'
          import re

          settings_path = "android/settings.gradle"
          with open(settings_path, "r") as f:
            content = f.read()

          if "dependencyResolutionManagement" not in content:
            # Find pluginManagement block
            pm_match = re.search(r'(pluginManagement\s*\{[^}]+\})', content)
            if pm_match:
              insert_pos = pm_match.end()
              drm_block = "\ndependencyResolutionManagement {\n  repositories {\n    mavenLocal()\n    google()\n    mavenCentral()\n  }\n}\n"
              content = content[:insert_pos] + drm_block + content[insert_pos:]
              print("✅ Added dependencyResolutionManagement block with mavenLocal")
            else:
              print("⚠️  pluginManagement block not found")
          else:
            # Add mavenLocal to existing dependencyResolutionManagement
            if "mavenLocal()" not in content:
              content = re.sub(
                r'dependencyResolutionManagement\s*\{',
                'dependencyResolutionManagement {\n  repositories {',
                content
              )
              content = re.sub(
                r'(repositories\s*\{(?:\s*\n\s*)?)',
                r'\1    mavenLocal()\n',
                content
              )
              print("✅ Added mavenLocal() to existing repositories")
            else:
              print("ℹ️  mavenLocal() already present")

          with open(settings_path, "w") as f:
            f.write(content)
          print("✅ settings.gradle patched successfully")
          with open(settings_path, "r") as f:
            print(f.read()[:500])
          PYEOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: accessible-chat-mobile.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5