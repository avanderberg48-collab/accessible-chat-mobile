name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Enable New Architecture
        run: |
          sed -i 's/"newArchEnabled": false/"newArchEnabled": true/' app.json
          cat app.json | grep newArch

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Add maven Local for async-storage workaround
        run: |
          if ! grep -q "mavenLocal()" android/settings.gradle; then
            sed -i 's/pluginManagement {/pluginManagement {\n    repositories.mavenLocal()/' android/settings.gradle
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -DnewArchEnabled=true
        env:
          EXPO_NEW_ARCHITECTURE_ENABLED: '1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5