name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Patch settings.gradle for mavenLocal
        run: |
          cat > /tmp/patch_settings.py << 'SCRIPTEOF'
          import re
          settings_path = "android/settings.gradle"
          with open(settings_path, "r") as f:
            content = f.read()
          if "dependencyResolutionManagement" not in content:
            pm_match = re.search(r'(pluginManagement\s*\{[^}]+\})', content)
            if pm_match:
              insert_pos = pm_match.end()
              drm_block = "\ndependencyResolutionManagement {\n  repositories {\n    mavenLocal()\n    google()\n    mavenCentral()\n  }\n}\n"
              content = content[:insert_pos] + drm_block + content[insert_pos:]
            else:
              print("WARNING: pluginManagement block not found")
          else:
            if "mavenLocal()" not in content:
              content = re.sub(r'(repositories\s*\{)', r'\1\n    mavenLocal()', content)
          with open(settings_path, "w") as f:
            f.write(content)
          print("settings.gradle patched successfully")
          SCRIPTEOF
          python3 /tmp/patch_settings.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: accessible-chat-mobile.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5