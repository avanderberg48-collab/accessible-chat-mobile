name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Enable New Architecture
        run: |
          sed -i 's/"newArchEnabled": false/"newArchEnabled": true/' app.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Patch build.gradle to add missing repositories
        run: |
          python3 << 'PYEOF'
          import re
          with open('android/build.gradle', 'r') as f:
            content = f.read()
          if 'google()' not in content:
            content = re.sub(
              r'(repositories\s*\{[^}]*\}|\{\s*)',
              r'\1\n                google()',
              content,
              count=1
            )
          if 'mavenCentral()' not in content:
            content = re.sub(
              r'(repositories\s*\{[^}]*\}|\{\s*)',
              r'\1\n                mavenCentral()',
              content,
              count=1
            )
          with open('android/build.gradle', 'w') as f:
            f.write(content)
          print("build.gradle patched")
          print(content[:500])
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          EXPO_NEW_ARCHITECTURE_ENABLED: '1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 5